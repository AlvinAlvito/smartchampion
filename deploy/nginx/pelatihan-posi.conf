#PROXY-START/
location /
{
    # Lapisan 1 anti-banjir/DDoS per IP (aplikasi punya lapisan 2 per fitur)
    limit_req zone=pelatihan_req burst=100 nodelay;
    limit_conn pelatihan_conn 60;
    limit_req_status 429;
    limit_conn_status 429;
    # Tutup koneksi lambat (slowloris)
    client_body_timeout 30s;
    send_timeout 30s;

    proxy_pass http://127.0.0.1:3030;
    proxy_set_header Host $host;
    # X-Real-IP ditimpa dengan IP asli → tidak bisa dipalsukan klien (dipakai rate limit aplikasi)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_redirect ~^https?://(localhost|127\.0\.0\.1)(:3030)?/(.*)$ https://$host/$3;
    # upload materi PDF maks 10 MB
    client_max_body_size 12m;
}
#PROXY-END/
