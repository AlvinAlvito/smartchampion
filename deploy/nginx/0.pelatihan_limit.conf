# Zona pembatas khusus pelatihan.posi.my.id (nama zona unik → tidak memengaruhi situs lain di VPS).
# Letak: /www/server/panel/vhost/nginx/0.pelatihan_limit.conf (ter-include di dalam blok http {}).
limit_req_zone  $binary_remote_addr zone=pelatihan_req:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=pelatihan_conn:10m;
